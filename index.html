<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目协作交付观测台 v4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .role-A {
            border-bottom: 3px solid #6366f1;
        }

        .role-B {
            border-bottom: 3px solid #f59e0b;
        }

        .role-C {
            border-bottom: 3px solid #10b981;
        }

        input[type="date"],
        input[type="text"] {
            background: transparent;
            width: 100%;
            outline: none;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        input:focus {
            background: #f1f5f9;
            box-shadow: inset 0 0 0 1px #cbd5e1;
        }

        input:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            background: #f8fafc;
        }

        .delay-warning {
            color: #ef4444;
            font-weight: bold;
            border-bottom: 2px solid #f87171 !important;
        }

        #loginOverlay {
            backdrop-filter: blur(8px);
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-700">

    <div id="loginOverlay" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center transition-all">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center">
            <h2 class="text-2xl font-bold mb-2 text-slate-800">身份验证</h2>
            <p class="text-slate-400 text-sm mb-6">请输入角色口令进入平台</p>
            <input type="password" id="rolePassword" placeholder="请输入口令..."
                class="w-full border-2 border-slate-100 rounded-xl px-4 py-3 mb-4 focus:border-indigo-500 outline-none text-center text-xl tracking-widest">
            <button onclick="verifyIdentity()"
                class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 active:scale-95 transition">进入系统</button>
            <p id="errorMsg" class="text-red-500 text-xs mt-3 hidden italic">口令错误，请核对或咨询管理员</p>
        </div>
    </div>

    <div class="max-w-full mx-auto">
        <div
            class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">项目协作交付观测台 <span class="text-xs font-normal text-slate-400 ml-2">v4.0</span></h1>
                <div class="flex gap-4 mt-3">
                    <span id="badgeA"
                        class="opacity-30 flex items-center px-2 py-1 bg-indigo-50 text-indigo-600 rounded text-xs font-bold transition">A:策划</span>
                    <span id="badgeB"
                        class="opacity-30 flex items-center px-2 py-1 bg-amber-50 text-amber-600 rounded text-xs font-bold transition">B:执行</span>
                    <span id="badgeC"
                        class="opacity-30 flex items-center px-2 py-1 bg-emerald-50 text-emerald-600 rounded text-xs font-bold transition">C:负责人</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="text-right mr-4">
                    <p class="text-[10px] text-slate-400 uppercase font-bold mb-1 tracking-wider">当前在线身份</p>
                    <p id="currentIdentityText" class="font-black text-indigo-600 text-lg">未验证</p>
                </div>
                <button onclick="logout()"
                    class="text-slate-400 hover:text-red-500 text-xs mr-4 underline transition">切换角色</button>
                <button id="addBtn" disabled onclick="addNewTask()"
                    class="bg-slate-300 text-white h-12 px-8 rounded-xl font-bold shadow-lg transition duration-200">
                    + 新增项目
                </button>
            </div>
        </div>

        <div class="bg-white shadow-2xl shadow-slate-200 rounded-3xl overflow-hidden border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead
                        class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider">
                        <tr>
                            <th class="p-6 font-bold w-64">项目任务 (A)</th>
                            <th class="p-6 font-bold text-indigo-600">期待交付 (A)</th>
                            <th class="p-6 font-bold text-amber-600">预计交付 (B)</th>
                            <th class="p-6 font-bold text-blue-600">确定交付 (C)</th>
                            <th class="p-6 font-bold text-emerald-600">完成交付 (C)</th>
                            <th class="p-6 font-bold text-center">状态 (C)</th>
                            <th class="p-6 font-bold text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody" class="divide-y divide-slate-100">
                    </tbody>
                </table>
            </div>
        </div>
        <p class="mt-4 text-center text-slate-400 text-xs">数据由 Supabase 实时数据库驱动 · 自动同步已开启</p>
    </div>

    <script>
        // ================= 配置区 =================
        const SUPABASE_URL = 'https://yowpkllrpoacfawupiyc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_s4uj9ALifFXAKcHYC0TYHQ_7cxFHErG'; 

        const PASSWORDS = {
            'A': '5231',   
            'B': '1760',   
            'C': '4382'    
        };
        // ==========================================

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentTasks = [];
        let myRole = null;

        function verifyIdentity() {
            const input = document.getElementById('rolePassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const role = Object.keys(PASSWORDS).find(key => PASSWORDS[key] === input);

            if (role) {
                myRole = role;
                localStorage.setItem('project_role', role); 
                initSystem();
            } else {
                errorMsg.classList.remove('hidden');
                setTimeout(() => errorMsg.classList.add('hidden'), 2000);
            }
        }

        function initSystem() {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('currentIdentityText').innerText = `角色 ${myRole}`;

            const addBtn = document.getElementById('addBtn');
            if (myRole === 'A' || myRole === 'C') {
                addBtn.disabled = false;
                addBtn.classList.replace('bg-slate-300', 'bg-indigo-600');
            }

            document.getElementById(`badge${myRole}`).classList.remove('opacity-30');
            document.getElementById(`badge${myRole}`).classList.add('ring-2', 'ring-offset-2', 'ring-indigo-500');
            loadData();
        }

        function logout() {
            localStorage.removeItem('project_role');
            location.reload();
        }

        async function loadData() {
            const { data } = await supabaseClient.from('task_platform').select('*').order('created_at', { ascending: false });
            if (data) {
                currentTasks = data;
                renderTable();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('taskTableBody');
            tbody.innerHTML = currentTasks.map(task => {
                const isDelayed = task.date_estimate && task.date_expect && (new Date(task.date_estimate) > new Date(task.date_expect));
                const canEdit = (fieldRole) => (myRole === fieldRole || myRole === 'C');

                return `
                <tr class="hover:bg-slate-50 transition duration-150 group">
                    <td class="p-5 font-medium">
                        <input type="text" value="${task.task_name || ''}" 
                               class="${canEdit('A') ? 'role-A font-bold text-slate-800' : 'text-slate-400'}"
                               ${!canEdit('A') ? 'disabled' : ''}
                               onblur="updateData('${task.id}', 'task_name', this.value)">
                    </td>
                    <td class="p-5">
                        <input type="date" value="${task.date_expect || ''}"
                               class="${canEdit('A') ? 'role-A text-indigo-600' : 'text-slate-400'}"
                               ${!canEdit('A') ? 'disabled' : ''}
                               onchange="updateData('${task.id}', 'date_expect', this.value)">
                    </td>
                    <td class="p-5">
                        <input type="date" value="${task.date_estimate || ''}"
                               class="${isDelayed ? 'delay-warning' : ''} ${canEdit('B') ? 'role-B text-amber-600' : 'text-slate-400'}"
                               ${!canEdit('B') ? 'disabled' : ''}
                               onchange="updateData('${task.id}', 'date_estimate', this.value)">
                    </td>
                    <td class="p-5">
                        <input type="date" value="${task.date_confirmed || ''}"
                               class="${myRole === 'C' ? 'role-C text-blue-600 font-bold' : 'text-slate-400'}"
                               ${myRole !== 'C' ? 'disabled' : ''}
                               onchange="updateData('${task.id}', 'date_confirmed', this.value)">
                    </td>
                    <td class="p-5">
                        <input type="date" value="${task.date_final || ''}"
                               class="${myRole === 'C' ? 'role-C text-emerald-600 font-bold' : 'text-slate-400'}"
                               ${myRole !== 'C' ? 'disabled' : ''}
                               onchange="updateData('${task.id}', 'date_final', this.value)">
                    </td>
                    <td class="p-5 text-center">
                        <select onchange="updateData('${task.id}', 'status', this.value)"
                                ${!canEdit('C') ? 'disabled' : ''}
                                class="text-xs font-bold border-none rounded-full px-4 py-1.5 ${task.status === '已完成' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}">
                            <option ${task.status === '进行中' ? 'selected' : ''}>进行中</option>
                            <option ${task.status === '已完成' ? 'selected' : ''}>已完成</option>
                            <option ${task.status === '挂起' ? 'selected' : ''}>挂起</option>
                        </select>
                    </td>
                    <td class="p-5 text-center">
                        ${myRole === 'C' ? `
                            <button onclick="deleteTask('${task.id}')" class="text-slate-300 hover:text-red-500 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        ` : '<span class="text-slate-200">🔒</span>'}
                    </td>
                </tr>
                `;
            }).join('');
        }

        async function updateData(id, field, value) {
            await supabaseClient.from('task_platform').update({ [field]: value }).eq('id', id);
        }

        async function addNewTask() {
            await supabaseClient.from('task_platform').insert([{ task_name: '新项目' }]);
        }

        async function deleteTask(id) {
            if (confirm('⚠️ 警告：确定要删除该项目吗？')) await supabaseClient.from('task_platform').delete().eq('id', id);
        }

        const savedRole = localStorage.getItem('project_role');
        if (savedRole) {
            myRole = savedRole;
            initSystem();
        }

        supabaseClient.channel('db_realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'task_platform' }, loadData).subscribe();

    </script>
</body>

</html>
